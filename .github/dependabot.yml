version: 2
updates:
  # Dependencias de Node.js
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependencias de Rust / Tauri
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
