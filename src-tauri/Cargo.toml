[package]
name = "ziron-studio"
version = "1.0.0"
description = "ZIRON Studio — 3D Scene Prototyping"
authors = ["superstrellaa"]
edition = "2021"

[lib]
name = "ziron_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-updater = "=2.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
once_cell = "1.19"
tauri-plugin-drpc = "0.1.6"
tauri-plugin-process = "2.4.0"
base64 = "0.23"
